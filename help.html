<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WhyNet — Открыть проверку сети</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 18px; color: #475569; font-size: 15px; line-height: 1.45; }
    .btn {
      display: block;
      width: 100%;
      padding: 15px 18px;
      border-radius: 14px;
      background: #1d4ed8;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 17px;
      box-sizing: border-box;
      margin-bottom: 10px;
    }
    .btn-sec {
      display: block;
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      background: #e2e8f0;
      color: #0f172a;
      border: 0;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    .info {
      text-align: left;
      background: #f1f5f9;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 18px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>WhyNet · Проверка сети</h1>
    <p>Нажмите кнопку ниже, чтобы открыть задание в приложении WhyNet.</p>
    <div id="summary" class="info">Загружаем параметры проверки...</div>
    <a id="openBtn" class="btn" href="#">Открыть в WhyNet</a>
    <button id="copyBtn" class="btn-sec" type="button">Скопировать ссылку</button>
  </div>
  <script>
    (function () {
      var qs = window.location.search || "";
      var params = new URLSearchParams(qs);
      var presetMap = {
        network: "Вся сеть и интернет",
        calls: "Звонки и мессенджеры",
        wifi: "Домашний Wi-Fi и роутер",
        sites: "Указанные сайты"
      };
      var preset = presetMap[params.get("preset")] || "Вся сеть и интернет";
      var targets = params.get("targets");
      var note = params.get("note");
      var lines = ["Режим: " + preset];
      if (targets) lines.push("Сайты: " + targets);
      if (note) lines.push("Подсказка: " + note);
      document.getElementById("summary").innerText = lines.join("\n");

      var cleanQuery = qs.startsWith("?") ? qs.slice(1) : qs;
      var intentUrl = "intent://help?" + cleanQuery + "#Intent;scheme=whynet;package=dev.whynet.app;end";
      var schemeUrl = "whynet://help?" + cleanQuery;
      var isAndroid = /android/i.test(navigator.userAgent || "");
      var targetUrl = isAndroid ? intentUrl : schemeUrl;

      var btn = document.getElementById("openBtn");
      btn.href = targetUrl;

      document.getElementById("copyBtn").addEventListener("click", function () {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(window.location.href);
          this.innerText = "Ссылка скопирована";
        }
      });

      if (cleanQuery && isAndroid) {
        setTimeout(function () {
          window.location.href = intentUrl;
        }, 120);
      }
    })();
  </script>
</body>
</html>
